<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>GLOWLY — Beauté Authentique</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* ========== STYLES (inchangés) ========== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-beige: #FDF8F0;
      --surface: #FFFFFF;
      --border-beige: #EDE0D4;
      --text-brun: #4A2C24;
      --text-muted: #8B6B5C;
      --rose-gold: #D8A7AB;
      --rose-gold-fonce: #C28B90;
      --gold-dore: #C9A87C;
      --marron-bois: #5E3A2E;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg-beige); color: var(--text-brun); line-height: 1.5; }
    .announcement { background: var(--marron-bois); color: #F9EADB; text-align: center; padding: 12px; font-size: 12px; }
    header { position: sticky; top: 0; background: rgba(253,248,240,0.96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-beige); z-index: 100; }
    .header-inner { max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; letter-spacing: 0.2em; background: linear-gradient(135deg, #5E3A2E, #C28B90); -webkit-background-clip: text; background-clip: text; color: transparent; text-transform: uppercase; }
    .nav-links { display: none; gap: 36px; }
    @media (min-width: 768px) { .nav-links { display: flex; } }
    .nav-links a { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #7C5D50; text-decoration: none; }
    .nav-links a:hover { color: var(--rose-gold-fonce); }
    .header-actions { display: flex; gap: 12px; }
    .btn-outline { background: transparent; border: 1px solid var(--rose-gold); color: var(--marron-bois); padding: 8px 20px; border-radius: 60px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-outline:hover { background: var(--rose-gold); color: white; }
    .cart-btn { display: flex; align-items: center; gap: 6px; background: white; border: 1px solid var(--border-beige); padding: 8px 20px; border-radius: 60px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .cart-count { background: var(--rose-gold-fonce); color: white; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; }
    .sub-nav { background: #FCF4EA; border-bottom: 1px solid var(--border-beige); }
    .sub-nav-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: center; gap: 32px; overflow-x: auto; }
    .sub-nav a { display: inline-block; padding: 16px 0; font-size: 13px; text-transform: uppercase; color: var(--text-brun); text-decoration: none; border-bottom: 2px solid transparent; }
    .sub-nav a:hover, .sub-nav a.active { color: var(--rose-gold-fonce); border-bottom-color: var(--gold-dore); }
    .hero-image { width: 100%; max-height: 80vh; object-fit: cover; display: block; }
    .hero-text-section { background: linear-gradient(145deg, #FCF4EA, #FFF8F0); padding: 60px 24px; text-align: center; }
    .hero-text-section h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.6rem, 8vw, 5rem); background: linear-gradient(135deg, #C28B90, #D8A7AB, #C9A87C); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 18px; }
    .hero-text-section p { max-width: 620px; margin: 0 auto 24px; color: #6E4E40; }
    .btn-gold { display: inline-block; background: linear-gradient(105deg, #D8A7AB, #C9A87C); color: #2E211B; padding: 14px 42px; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; border-radius: 50px; text-decoration: none; box-shadow: 0 8px 18px rgba(165,106,97,0.25); transition: 0.3s; }
    .btn-gold:hover { transform: translateY(-2px); }
    .carousel-section { background: var(--bg-beige); padding: 30px 0; border-top: 1px solid var(--border-beige); border-bottom: 1px solid var(--border-beige); margin: 0; }
    .carousel-title { text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--marron-bois); margin-bottom: 20px; }
    .carousel-container { width: 100%; overflow: hidden; }
    .carousel-track { display: flex; gap: 0; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: thin; padding: 0; -webkit-overflow-scrolling: touch; }
    .carousel-track::-webkit-scrollbar { height: 4px; }
    .carousel-track::-webkit-scrollbar-track { background: var(--border-beige); }
    .carousel-track::-webkit-scrollbar-thumb { background: var(--rose-gold); border-radius: 10px; }
    .carousel-item { flex: 0 0 auto; width: 130px; text-align: center; cursor: pointer; transition: transform 0.2s; }
    .carousel-item:hover { transform: translateY(-4px); }
    .carousel-item-img { width: 100%; aspect-ratio: 1; background: #FEF5ED; border-radius: 12px; overflow: hidden; }
    .carousel-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .carousel-item-name { margin-top: 6px; font-size: 0.8rem; font-weight: 500; color: var(--text-brun); word-break: break-word; padding: 0 4px; }
    .section { max-width: 1280px; margin: 0 auto; padding: 80px 24px; }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; text-align: center; color: var(--marron-bois); margin-bottom: 12px; }
    .section-subtitle { text-align: center; color: #9C7A6B; font-style: italic; margin-bottom: 48px; }
    .bestsellers-container { display: flex; flex-direction: column; gap: 40px; }
    @media (min-width: 769px) {
      .bs-card { display: flex; flex-direction: row; align-items: stretch; background: white; border-radius: 28px; overflow: hidden; border: 1px solid #F0E1D6; transition: 0.3s; }
      .bs-card:hover { transform: translateY(-6px); box-shadow: 0 20px 35px rgba(94,58,46,0.08); }
      .bs-card.left-img { flex-direction: row; }
      .bs-card.right-img { flex-direction: row-reverse; }
      .bs-img { flex: 1; min-width: 280px; background-size: cover; background-position: center; }
      .brown-bg { flex: 1.5; background-color: #5E3A2E; padding: 32px; color: #FEF0E3; display: flex; flex-direction: column; justify-content: center; }
      .brown-bg h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; margin-bottom: 12px; color: #FDF4EA; }
      .bs-description { color: #F0DBCE; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
      .btn-brown { background: #D8A7AB; color: #2E211B; border: none; padding: 12px 28px; border-radius: 40px; font-size: 11px; font-weight: 700; cursor: pointer; align-self: flex-start; transition: 0.2s; }
      .btn-brown:hover { background: #C9A87C; transform: scale(1.02); }
    }
    @media (max-width: 768px) {
      .bs-card { display: flex; flex-direction: row !important; background: white; border-radius: 20px; overflow: hidden; border: 1px solid #F0E1D6; margin-bottom: 20px; align-items: stretch; }
      .bs-img { flex: 1; background-size: cover; background-position: center; min-height: 100%; }
      .brown-bg { flex: 1; background-color: #5E3A2E; padding: 12px; color: #FEF0E3; display: flex; flex-direction: column; justify-content: center; }
      .brown-bg h3 { font-size: 1rem; margin-bottom: 6px; color: #FDF4EA; }
      .bs-description { font-size: 0.7rem; line-height: 1.3; margin-bottom: 8px; color: #F0DBCE; }
      .btn-brown { background: #D8A7AB; color: #2E211B; border: none; padding: 6px 12px; border-radius: 40px; font-size: 9px; font-weight: 600; cursor: pointer; align-self: flex-start; }
    }
    .coaching-section { background: #FDF4EF; padding: 60px 24px; }
    .diagnostic-container { max-width: 800px; margin: 0 auto; background: white; border-radius: 32px; padding: 40px; box-shadow: 0 12px 30px rgba(0,0,0,0.05); border: 1px solid var(--border-beige); }
    .diagnostic-question { margin-bottom: 24px; }
    .diagnostic-question label { font-weight: 600; display: block; margin-bottom: 8px; color: var(--marron-bois); }
    .diagnostic-question select, .diagnostic-question input { width: 100%; padding: 12px; border-radius: 40px; border: 1px solid var(--border-beige); font-family: inherit; background: var(--bg-beige); }
    .diagnostic-btn { background: var(--marron-bois); color: white; border: none; padding: 12px 28px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .diagnostic-btn:hover { background: var(--rose-gold-fonce); }
    .recommendation-results { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .rec-card { background: var(--bg-beige); border-radius: 20px; overflow: hidden; border: 1px solid var(--border-beige); transition: 0.2s; cursor: pointer; }
    .rec-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px rgba(0,0,0,0.05); }
    .rec-img { aspect-ratio: 1; background: #FEF5ED; background-size: cover; background-position: center; }
    .rec-info { padding: 12px; text-align: center; }
    .rec-info h4 { font-size: 0.9rem; margin-bottom: 4px; }
    .rec-price { font-weight: 700; color: var(--rose-gold-fonce); font-size: 0.85rem; }
    .histoire-section { background: var(--bg-beige); padding: 80px 24px; text-align: center; }
    .histoire-container { max-width: 900px; margin: 0 auto; }
    .histoire-container p { font-size: 1.1rem; line-height: 1.7; color: var(--text-brun); margin-bottom: 24px; }
    .histoire-container p:first-of-type { font-size: 1.2rem; font-weight: 500; }
    .histoire-signature { margin-top: 30px; font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--rose-gold-fonce); font-style: italic; }
    .science-section { background: #FDF4EF; padding: 60px 24px; }
    .science-flex { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px; max-width: 1000px; margin: 0 auto; }
    .science-item { text-align: center; background: rgba(255,245,240,0.6); padding: 32px 20px; border-radius: 32px; transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1); opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.02); }
    .science-item.visible { opacity: 1; transform: translateY(0); }
    .science-item:hover { transform: translateY(-8px); background: white; box-shadow: 0 20px 30px rgba(94,58,46,0.08); border: 1px solid var(--rose-gold); }
    .science-icon { font-size: 2.8rem; margin-bottom: 16px; display: inline-block; transition: transform 0.3s ease; }
    .science-item:hover .science-icon { transform: scale(1.1); }
    .science-item h4 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; margin-bottom: 12px; color: var(--marron-bois); }
    .science-item p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }
    .card { background: white; border-radius: 20px; overflow: hidden; cursor: pointer; transition: 0.2s; border: 1px solid #F2E2D8; }
    .card:hover { transform: translateY(-5px); border-color: var(--rose-gold); }
    .card-img { aspect-ratio: 1; background: #FEF5ED; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 16px; text-align: center; }
    .card-body h3 { font-size: 0.9rem; font-weight: 500; }
    .price { font-weight: 700; color: #C28B90; }
    .testimonial-grid { display: grid; gap: 24px; max-width: 800px; margin: 0 auto; }
    @media (min-width: 640px) { .testimonial-grid { grid-template-columns: repeat(2, 1fr); } }
    .testimonial { background: white; padding: 28px; border-radius: 28px; border: 1px solid #F2E0D4; }
    .stars { color: #D8A7AB; margin-bottom: 12px; }
    footer { background: #3E2920; color: #E7D8CF; padding: 50px 24px 30px; }
    .footer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; max-width: 1000px; margin: 0 auto 40px; }
    @media (min-width: 700px) { .footer-grid { grid-template-columns: repeat(4, 1fr); } }
    .footer-col h4 { color: #F0DBCE; margin-bottom: 16px; }
    .footer-col a { color: #CFB9AE; text-decoration: none; font-size: 13px; display: block; margin-bottom: 8px; }
    .contact-form { max-width: 400px; margin: 20px auto 0; }
    .contact-form input, .contact-form textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 40px; }
    .contact-form button { background: var(--gold-dore); border: none; padding: 12px; width: 100%; border-radius: 40px; font-weight: 600; color: #2E211B; cursor: pointer; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 2000; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: opacity 0.3s ease, visibility 0.3s; }
    .overlay.open { visibility: visible; opacity: 1; }
    .lightbox-container { background: white; width: 90%; max-width: 1000px; border-radius: 32px; overflow: hidden; display: flex; flex-direction: row; box-shadow: 0 30px 50px rgba(0,0,0,0.3); animation: fadeInUp 0.3s ease; position: relative; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .lightbox-gallery { flex: 1; background: #FEF5ED; display: flex; align-items: center; justify-content: center; padding: 30px; position: relative; }
    .lightbox-gallery img { max-height: 60vh; width: auto; max-width: 100%; object-fit: contain; border-radius: 20px; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 10; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
    .lightbox-nav:hover { background: rgba(0,0,0,0.8); }
    .lightbox-nav.prev { left: 10px; }
    .lightbox-nav.next { right: 10px; }
    .lightbox-info { flex: 1; padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 16px; background: white; }
    .lightbox-cat { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.3em; color: var(--rose-gold-fonce); text-transform: uppercase; }
    .lightbox-info h2 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: var(--text-brun); margin: 0; }
    .lightbox-price { font-size: 1.8rem; font-weight: 700; color: var(--rose-gold-fonce); }
    .lightbox-desc { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }
    .lightbox-add-btn { background: var(--marron-bois); color: white; border: none; padding: 14px 24px; border-radius: 60px; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.05em; cursor: pointer; transition: background 0.2s, transform 0.1s; align-self: flex-start; }
    .lightbox-add-btn:hover { background: var(--rose-gold-fonce); transform: scale(1.02); }
    .lightbox-close { position: absolute; top: 20px; right: 30px; background: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: 0.2s; z-index: 20; }
    .lightbox-close:hover { background: #f0f0f0; transform: scale(1.05); }
    @media (max-width: 768px) {
      .lightbox-container { flex-direction: column; width: 95%; }
      .lightbox-gallery { padding: 20px; }
      .lightbox-info { padding: 24px; text-align: center; }
      .lightbox-add-btn { align-self: center; }
      .lightbox-info h2 { font-size: 1.6rem; }
      .lightbox-price { font-size: 1.5rem; }
      .lightbox-nav { width: 30px; height: 30px; font-size: 18px; }
    }
    .cart-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 400px; max-width: 90vw; background: white; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.35s ease; }
    .overlay.open .cart-panel { transform: translateX(0); }
    .modal-card { background: white; border-radius: 32px; max-width: 480px; width: 90%; padding: 32px; max-height: 90vh; overflow-y: auto; }
    .field { margin-bottom: 16px; }
    .field label { font-size: 11px; text-transform: uppercase; color: #8B6B5C; display: block; margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 12px; border: 1px solid #EDE0D4; border-radius: 40px; }
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #3E2920; color: #f5e2d6; padding: 12px 28px; border-radius: 60px; font-size: 13px; z-index: 2100; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    #toast.show { opacity: 1; }
    .loader { text-align: center; padding: 40px; color: var(--rose-gold-fonce); }
  </style>
</head>
<body>
  <!-- ... le HTML reste strictement identique (header, hero, etc.) ... -->
  <div class="announcement">✨ Livraison express partout au Sénégal | Commandez avant 14h ✨</div>
  <!-- ... tout le contenu statique (identique à ton ancien code) ... -->
  <div id="toast"></div>

  <script>
    // ==================== CONFIGURATION ====================
    // ⚠️ REMPLACE PAR TA VRAIE URL APRÈS DÉPLOIEMENT
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxwQ0dybmPG-fN2ShVU2EMc8UI4I01d6nCi3owFoERyBAiD1hFaRtCZysKCpYN6dUj/exec';
    
    let allProducts = [];
    let cart = [];
    let promoReduction = 0;
    let currentLightboxProduct = null;
    let currentLightboxImages = [];
    let currentLightboxIndex = 0;
    let currentCategory = "";
    let currentSearch = "";

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    // ========== VÉRIFICATION STOCK EN TEMPS RÉEL (SERVEUR) ==========
    async function getStockFromServer(productId, productName) {
      try {
        const url = `${SCRIPT_URL}?action=getStock&id=${encodeURIComponent(productId)}&nom=${encodeURIComponent(productName)}`;
        const response = await fetch(url);
        const data = await response.json();
        if (data.ok) return data.stock;
        else return -1;
      } catch (err) {
        console.error("Erreur récupération stock", err);
        return -1;
      }
    }

    // ========== CHARGEMENT DES PRODUITS (GET) ==========
    async function chargerProduits() {
      try {
        console.log("Chargement des produits depuis:", SCRIPT_URL);
        const response = await fetch(`${SCRIPT_URL}?action=produits`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data.ok && data.produits && data.produits.length > 0) {
          allProducts = data.produits;
          console.log("✅ Produits chargés:", allProducts.length);
        } else {
          throw new Error(data.error || "Aucun produit reçu");
        }
      } catch (err) {
        console.error("❌ Erreur chargement produits:", err);
        showToast("⚠️ Erreur de chargement. Vérifiez votre URL Apps Script !");
        allProducts = [
          { id: 1, nom: "Savon Curcuma", prix: 8500, img: "https://images.unsplash.com/photo-1600857062241-98e5dba7f214?w=400", cat: "Nettoyants", desc: "Purifie et éclaire le teint.", stock: 10 },
          { id: 2, nom: "Toner Glycolique", prix: 12500, img: "https://images.unsplash.com/photo-1620916566390-22f5e7abca7e?w=400", cat: "Toners", desc: "Exfoliation douce.", stock: 10 }
        ];
      }
      renderCategories();
      renderProducts();
      initCarousel();
    }

    async function chargerBestSellers() {
      const container = document.getElementById('bestsellersContainer');
      if (!container) return;
      container.innerHTML = '<div class="loader">Chargement des best-sellers...</div>';
      try {
        const response = await fetch(`${SCRIPT_URL}?action=bestsellers`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data.ok && data.bestsellers && data.bestsellers.length > 0) {
          let html = '';
          data.bestsellers.forEach((prod, index) => {
            const directionClass = (index % 2 === 0) ? 'left-img' : 'right-img';
            const imgUrl = prod.img || 'https://placehold.co/800x800/FEF5ED/C28B90?text=Glowly';
            const description = prod.desc || `Découvrez ${prod.nom}, plébiscité par notre communauté.`;
            const prix = Number(prod.prix).toLocaleString();
            html += `
              <div class="bs-card ${directionClass}">
                <div class="bs-img" style="background-image: url('${escapeHtml(imgUrl)}');"></div>
                <div class="brown-bg">
                  <h3>${escapeHtml(prod.nom)}</h3>
                  <p class="bs-description">${escapeHtml(description)}</p>
                  <button class="btn-brown" onclick="addRoutine('${escapeHtml(prod.nom)}', ${prod.prix})">AJOUTER — ${prix} FCFA</button>
                </div>
              </div>
            `;
          });
          container.innerHTML = html;
        } else {
          container.innerHTML = '<div class="loader">Aucun best-seller disponible</div>';
        }
      } catch (err) {
        console.error("Erreur best-sellers:", err);
        container.innerHTML = '<div class="loader">Erreur chargement best-sellers</div>';
      }
    }

    // ========== DIAGNOSTIC ==========
    function getRecommendations() {
      const skinType = document.getElementById('skinType').value;
      const concern = document.getElementById('skinConcern').value;
      let advice = "";
      if (skinType === 'seche') advice = "Pour les peaux sèches, privilégiez les soins hydratants. ";
      else if (skinType === 'grasse') advice = "Pour les peaux grasses, optez pour des textures légères. ";
      else if (skinType === 'mixte') advice = "Pour les peaux mixtes, équilibrez avec des produits adaptés. ";
      else if (skinType === 'sensible') advice = "Pour les peaux sensibles, choisissez des soins doux. ";
      else advice = "Pour les peaux normales, maintenez l'équilibre. ";
      if (concern === 'taches') advice += "Pour les taches, essayez la vitamine C ou le curcuma.";
      else if (concern === 'secheresse') advice += "Pour la sécheresse, hydratez intensément.";
      else if (concern === 'acne') advice += "Pour l'acné, nettoyez en douceur.";
      else if (concern === 'rides') advice += "Pour les rides, utilisez du collagène.";
      else advice += "Pour l'éclat, exfoliez régulièrement.";

      let filtered = allProducts.filter(p => {
        const name = p.nom.toLowerCase();
        if (concern === 'taches') return name.includes('curcuma') || name.includes('vitamine');
        if (concern === 'secheresse') return name.includes('miel') || name.includes('manuka');
        if (concern === 'acne') return name.includes('nettoyant') || name.includes('toner');
        if (concern === 'rides') return name.includes('collagène') || name.includes('sérum');
        return true;
      }).slice(0, 4);

      const container = document.getElementById('recommendations');
      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:20px;"><p>${advice}</p><p>Contactez-nous pour plus de conseils.</p></div>`;
        return;
      }
      let html = `<div style="grid-column:1/-1; margin-bottom:20px; text-align:center; background:#FDF4EF; padding:16px; border-radius:20px;"><p style="font-weight:500;">${advice}</p></div>`;
      filtered.forEach(prod => {
        const imgUrl = prod.img || 'https://placehold.co/400x400/FEF5ED/C28B90?text=Glowly';
        html += `
          <div class="rec-card" onclick='openLightbox(${JSON.stringify(prod).replace(/'/g, "&#39;")})'>
            <div class="rec-img" style="background-image: url('${escapeHtml(imgUrl)}');"></div>
            <div class="rec-info">
              <h4>${escapeHtml(prod.nom)}</h4>
              <div class="rec-price">${Number(prod.prix).toLocaleString()} FCFA</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // ========== CARROUSEL ==========
    function initCarousel() {
      const track = document.getElementById('carouselTrack');
      if (!track) return;
      if (allProducts.length === 0) {
        track.innerHTML = '<div style="padding:20px; text-align:center;">Aucun produit disponible</div>';
        return;
      }
      track.innerHTML = '';
      for (let d = 0; d < 3; d++) {
        allProducts.forEach(prod => {
          const item = document.createElement('div');
          item.className = 'carousel-item';
          item.onclick = () => openLightbox(prod);
          const imgSrc = prod.img || 'https://placehold.co/400x400/FEF5ED/C28B90?text=Image';
          item.innerHTML = `
            <div class="carousel-item-img">
              <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(prod.nom)}" loading="lazy">
            </div>
            <div class="carousel-item-name">${escapeHtml(prod.nom)}</div>
          `;
          track.appendChild(item);
        });
      }
    }

    // ========== CATÉGORIES ET PRODUITS ==========
    function renderCategories() {
      const cats = [...new Set(allProducts.map(p => p.cat).filter(c => c && c.trim() !== ""))];
      const bar = document.getElementById('catBar');
      if (!bar) return;
      let html = `<button class="btn-outline" onclick="setCategory('')" style="background:${currentCategory === '' ? 'var(--rose-gold-fonce)' : 'transparent'}; color:${currentCategory === '' ? 'white' : 'var(--marron-bois)'}">Tous</button>`;
      cats.forEach(cat => {
        html += `<button class="btn-outline" onclick="setCategory('${cat.replace(/'/g, "\\'")}')" style="background:${currentCategory === cat ? 'var(--rose-gold-fonce)' : 'transparent'}; color:${currentCategory === cat ? 'white' : 'var(--marron-bois)'}">${cat}</button>`;
      });
      bar.innerHTML = html;
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderProducts();
    }

    function filterProducts() {
      currentSearch = document.getElementById('searchInput').value.toLowerCase();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      if (!grid) return;
      let filtered = allProducts;
      if (currentCategory) filtered = filtered.filter(p => p.cat === currentCategory);
      if (currentSearch) filtered = filtered.filter(p => p.nom.toLowerCase().includes(currentSearch));
      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;">Aucun produit trouvé</div>';
        return;
      }
      grid.innerHTML = filtered.map(p => `
        <div class="card" onclick='openLightbox(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
          <div class="card-img">
            <img src="${p.img || 'https://placehold.co/400x400/FEF5ED/C28B90?text=Glowly'}" alt="${escapeHtml(p.nom)}" loading="lazy">
          </div>
          <div class="card-body">
            <h3>${escapeHtml(p.nom)}</h3>
            <div class="price">${Number(p.prix).toLocaleString()} FCFA</div>
          </div>
        </div>
      `).join('');
    }

    // ========== PANIER (avec vérification serveur) ==========
    function saveCart() {
      localStorage.setItem('glowly_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function loadCart() {
      const saved = localStorage.getItem('glowly_cart');
      if (saved) cart = JSON.parse(saved);
      updateCartUI();
    }

    function updateCartUI() {
      const countSpan = document.getElementById('cartCount');
      const totalItems = cart.reduce((s, i) => s + i.qty, 0);
      if (countSpan) countSpan.innerText = totalItems;
      const container = document.getElementById('cartItems');
      const footer = document.getElementById('cartFooter');
      if (!container) return;
      if (cart.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px;">Panier vide</div>';
        footer.style.display = 'none';
      } else {
        let html = '';
        for (const item of cart) {
          const safeId = item.id.toString().replace(/[^a-zA-Z0-9]/g, '_');
          html += `
            <div style="display:flex; justify-content:space-between; margin-bottom:16px; border-bottom:1px solid #eee; padding-bottom:8px;">
              <div style="flex:2;">
                <strong>${escapeHtml(item.name)}</strong><br>
                ${Number(item.price).toLocaleString()} FCFA
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <button onclick="changeQty('${item.id}', -1)" style="background:#eee; border:none; width:28px; border-radius:20px; cursor:pointer;">-</button>
                <input type="number" id="qty-${safeId}" value="${item.qty}" min="1" style="width:60px; text-align:center; border:1px solid #ddd; border-radius:8px; padding:4px;" onchange="updateQuantityFromInput('${item.id}', this.value)">
                <button onclick="changeQty('${item.id}', 1)" style="background:#eee; border:none; width:28px; border-radius:20px; cursor:pointer;">+</button>
                <button onclick="removeItem('${item.id}')" style="background:none; border:none; color:#b00; cursor:pointer;">🗑️</button>
              </div>
            </div>
          `;
        }
        container.innerHTML = html;
        footer.style.display = 'block';
        const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const total = subtotal - promoReduction;
        document.getElementById('cartTotal').innerText = (total > 0 ? total : 0).toLocaleString() + ' FCFA';
      }
    }

    async function updateQuantityFromInput(id, newQtyStr) {
      let newQty = parseInt(newQtyStr, 10);
      if (isNaN(newQty)) newQty = 1;
      const item = cart.find(i => i.id == id);
      if (!item) return;
      
      const maxStock = await getStockFromServer(item.id, item.name);
      if (maxStock < 0) {
        showToast("❌ Impossible de vérifier le stock, réessayez.");
        const safeId = id.toString().replace(/[^a-zA-Z0-9]/g, '_');
        document.getElementById(`qty-${safeId}`).value = item.qty;
        return;
      }
      if (newQty > maxStock) {
        showToast(`❌ Stock insuffisant. Maximum disponible : ${maxStock}`);
        const safeId = id.toString().replace(/[^a-zA-Z0-9]/g, '_');
        document.getElementById(`qty-${safeId}`).value = item.qty;
        return;
      }
      if (newQty < 1) newQty = 1;
      item.qty = newQty;
      saveCart();
    }

    async function changeQty(id, delta) {
      const idx = cart.findIndex(i => i.id == id);
      if (idx === -1) return;
      let newQty = cart[idx].qty + delta;
      const maxStock = await getStockFromServer(cart[idx].id, cart[idx].name);
      if (maxStock < 0) {
        showToast("❌ Impossible de vérifier le stock, réessayez.");
        return;
      }
      if (newQty > maxStock) {
        showToast(`❌ Stock insuffisant. Maximum : ${maxStock}`);
        return;
      }
      if (newQty < 1) newQty = 1;
      cart[idx].qty = newQty;
      saveCart();
    }

    function removeItem(id) {
      cart = cart.filter(i => i.id != id);
      saveCart();
    }

    async function addToCart(product) {
      const maxStock = await getStockFromServer(product.id, product.nom);
      if (maxStock <= 0) {
        showToast("❌ Ce produit est actuellement en rupture de stock.");
        return;
      }
      const existing = cart.find(i => i.id == product.id);
      if (existing) {
        if (existing.qty + 1 > maxStock) {
          showToast(`❌ Stock insuffisant. Maximum : ${maxStock}`);
          return;
        }
        existing.qty++;
      } else {
        cart.push({ id: product.id, name: product.nom, price: product.prix, qty: 1 });
      }
      saveCart();
      showToast(`${product.nom} ajouté au panier`);
    }

    function addRoutine(name, price) {
      const routineId = Date.now();
      cart.push({ id: routineId.toString(), name: name, price: price, qty: 1 });
      saveCart();
      showToast(`${name} ajouté au panier`);
    }

    // ========== LIGHTBOX ==========
    function openLightbox(product) {
      currentLightboxProduct = product;
      currentLightboxImages = [product.img || '', product.img2 || '', product.img3 || ''].filter(url => url && url.trim() !== '');
      if (currentLightboxImages.length === 0) currentLightboxImages = ['https://placehold.co/600x600/FEF5ED/C28B90?text=Glowly'];
      currentLightboxIndex = 0;
      document.getElementById('lbImage').src = currentLightboxImages[0];
      document.getElementById('lbTitle').innerText = product.nom;
      document.getElementById('lbPrice').innerText = Number(product.prix).toLocaleString() + ' FCFA';
      document.getElementById('lbDesc').innerText = product.desc || 'Découvrez ce produit exceptionnel.';
      document.getElementById('lbCat').innerText = product.cat || 'Produit';
      document.getElementById('lightboxOverlay').classList.add('open');
    }

    function prevLightboxImage(event) {
      event.stopPropagation();
      if (currentLightboxImages.length <= 1) return;
      currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxImages.length) % currentLightboxImages.length;
      document.getElementById('lbImage').src = currentLightboxImages[currentLightboxIndex];
    }

    function nextLightboxImage(event) {
      event.stopPropagation();
      if (currentLightboxImages.length <= 1) return;
      currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxImages.length;
      document.getElementById('lbImage').src = currentLightboxImages[currentLightboxIndex];
    }

    function closeLightbox(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('lightboxOverlay').classList.remove('open');
    }

    function addCurrentLightboxToCart() {
      if (currentLightboxProduct) addToCart(currentLightboxProduct);
      closeLightbox();
    }

    // ========== MODAL PANIER ==========
    function openCart() {
      document.getElementById('cartOverlay').classList.add('open');
    }

    function closeCart(e, force) {
      if (force || (e && e.target === document.getElementById('cartOverlay'))) {
        document.getElementById('cartOverlay').classList.remove('open');
      }
    }

    // ========== CODE PROMO (GET) ==========
    async function applyPromoCode() {
      const code = document.getElementById('promoCode').value.trim();
      if (!code) {
        showToast("Entrez un code");
        return;
      }
      const productNames = cart.map(item => item.name);
      try {
        const url = `${SCRIPT_URL}?action=verifierPromo&code=${encodeURIComponent(code)}&produits=${encodeURIComponent(productNames.join(','))}`;
        const response = await fetch(url);
        const data = await response.json();
        if (data.ok && data.reduction > 0) {
          promoReduction = data.reduction;
          document.getElementById('promoMsg').innerText = `✅ Réduction ${promoReduction} FCFA appliquée !`;
          document.getElementById('promoMsg').style.color = '#2E7D32';
        } else {
          promoReduction = 0;
          document.getElementById('promoMsg').innerText = "❌ Code invalide";
          document.getElementById('promoMsg').style.color = '#b00';
        }
        updateOrderSummary();
      } catch (err) {
        console.error("Erreur promo:", err);
        showToast("Erreur vérification code promo");
      }
    }

    // ========== CHECKOUT (COMMANDE en GET) ==========
    function updateOrderSummary() {
      const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const total = subtotal - promoReduction;
      document.getElementById('orderSummary').innerHTML = cart.map(i => 
        `${escapeHtml(i.name)} x${i.qty} : ${(i.price * i.qty).toLocaleString()} FCFA`
      ).join('<br>') + 
      `<br><strong>Sous-total : ${subtotal.toLocaleString()} FCFA</strong>
      <br>Réduction : -${promoReduction.toLocaleString()} FCFA
      <br><strong>Total : ${(total > 0 ? total : 0).toLocaleString()} FCFA</strong>`;
    }

    function openCheckout() {
      if (cart.length === 0) {
        showToast("Panier vide");
        return;
      }
      updateOrderSummary();
      document.getElementById('checkoutModal').classList.add('open');
    }

    function closeCheckout(e) {
      if (e.target === document.getElementById('checkoutModal')) {
        document.getElementById('checkoutModal').classList.remove('open');
      }
    }

    function generateIdVente() {
      return "GLW-" + Date.now() + "-" + Math.floor(Math.random() * 10000);
    }

    async function confirmOrder() {
      const name = document.getElementById('checkoutName').value.trim();
      const phone = document.getElementById('checkoutPhone').value.trim();
      const region = document.getElementById('checkoutRegion').value;
      const quartier = document.getElementById('checkoutQuartier').value.trim();
      if (!name || !phone || !quartier) {
        showToast("Veuillez remplir tous les champs obligatoires (*)");
        return;
      }
      const adresseComplete = `${quartier}, ${document.getElementById('checkoutAddress').value.trim()}, ${region}`;
      const paiement = document.getElementById('checkoutPayment').value;
      
      const idVente = generateIdVente();
      const lignes = cart.map(item => ({
        idVente: idVente,
        nomProduit: item.name,
        quantite: item.qty,
        prixTotalPaye: Math.round(item.price * item.qty),
        telephone: phone,
        nomClient: name,
        adresse: adresseComplete,
        paiement: paiement,
        mentionPromo: promoReduction > 0 ? `Promo -${promoReduction} FCFA` : ""
      }));
      const commandeJson = JSON.stringify(lignes);
      const url = `${SCRIPT_URL}?action=enregistrerCommande&data=${encodeURIComponent(commandeJson)}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        if (data.ok) {
          document.getElementById('orderSuccess').style.display = 'block';
          cart = [];
          promoReduction = 0;
          saveCart();
          // Recharger les produits pour mettre à jour l'affichage des stocks
          chargerProduits();
          setTimeout(() => {
            document.getElementById('checkoutModal').classList.remove('open');
            document.getElementById('orderSuccess').style.display = 'none';
            showToast("✅ Commande confirmée ! Nous vous contacterons.");
          }, 2000);
        } else {
          showToast("❌ Erreur : " + (data.error || "Réessayez"));
        }
      } catch (err) {
        console.error("Erreur commande:", err);
        showToast("❌ Erreur de connexion");
      }
    }

    // ========== CONTACT (en GET) ==========
    function openContactModal() {
      document.getElementById('contactModal').classList.add('open');
    }

    function closeContactModal(e) {
      if (e.target === document.getElementById('contactModal')) {
        document.getElementById('contactModal').classList.remove('open');
      }
    }

    async function sendContact() {
      const nom = document.getElementById('contactName').value.trim();
      const tel = document.getElementById('contactPhone').value.trim();
      const msg = document.getElementById('contactMessage').value.trim();
      if (!nom || !tel) {
        showToast("Merci de remplir nom et téléphone");
        return;
      }
      const btn = document.getElementById('contactBtn');
      btn.disabled = true;
      btn.innerText = "Envoi...";
      try {
        const url = `${SCRIPT_URL}?action=envoyerContact&nom=${encodeURIComponent(nom)}&telephone=${encodeURIComponent(tel)}&message=${encodeURIComponent(msg || "Pas de message")}`;
        const response = await fetch(url);
        const data = await response.json();
        if (data.ok) {
          document.getElementById('contactAck').style.display = 'block';
          setTimeout(() => {
            document.getElementById('contactAck').style.display = 'none';
            document.getElementById('contactModal').classList.remove('open');
            document.getElementById('contactName').value = '';
            document.getElementById('contactPhone').value = '';
            document.getElementById('contactMessage').value = '';
            showToast("✅ Message envoyé !");
          }, 1200);
        } else {
          showToast("❌ Erreur : " + (data.error || "Réessayez"));
        }
      } catch (err) {
        console.error("Erreur contact:", err);
        showToast("❌ Erreur de connexion");
      } finally {
        btn.disabled = false;
        btn.innerText = "Envoyer";
      }
    }

    async function sendFooterMessage() {
      const nom = document.getElementById('footerName').value.trim();
      const tel = document.getElementById('footerPhone').value.trim();
      const msg = document.getElementById('footerMsg').value.trim();
      if (!nom || !tel) {
        showToast("Merci de remplir nom et WhatsApp");
        return;
      }
      try {
        const url = `${SCRIPT_URL}?action=envoyerContact&nom=${encodeURIComponent(nom)}&telephone=${encodeURIComponent(tel)}&message=${encodeURIComponent(msg || "Message depuis footer")}`;
        const response = await fetch(url);
        const data = await response.json();
        if (data.ok) {
          showToast(`✅ Merci ${nom}, nous vous répondons !`);
          document.getElementById('footerName').value = '';
          document.getElementById('footerPhone').value = '';
          document.getElementById('footerMsg').value = '';
        } else {
          showToast("❌ Erreur d'envoi");
        }
      } catch (err) {
        console.error("Erreur footer:", err);
        showToast("❌ Erreur de connexion");
      }
    }

    // ========== OBSERVERS ==========
    function observeScienceItems() {
      const items = document.querySelectorAll('.science-item');
      if (!items.length) return;
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.2 });
      items.forEach(item => observer.observe(item));
    }

    // ========== INITIALISATION ==========
    window.addEventListener('load', () => {
      console.log("🚀 Initialisation Glowly...");
      console.log("URL Apps Script:", SCRIPT_URL);
      loadCart();
      chargerProduits();
      chargerBestSellers();
      observeScienceItems();
      document.getElementById('searchInput')?.addEventListener('input', filterProducts);
    });
  </script>
</body>
